spring.application.name=maintenance-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/db_maintenance?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password="--"
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.routes.maintenance.exchange=maintenance-exchange
app.rabbitmq.routes.maintenance.queue=maintenance-queue
app.rabbitmq.routes.maintenance.routing-key=maintenance.routing.key